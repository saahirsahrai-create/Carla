name: Carla Win64

on:
  workflow_dispatch:

env:
  CACHE_VERSION: 7
  DEBIAN_FRONTEND: noninteractive
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  PAWPAW_SKIP_LTO: 1
  PAWPAW_SKIP_TESTS: 1
  PAWPAW_SKIP_FLUIDSYNTH: 0
  PAWPAW_VERSION: 6ff87c77cf680ab1b18ca36b79e9e09732d34fc3

jobs:
  win64:
    runs-on: ubuntu-latest

    container:
      image: ubuntu:22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up cache
        uses: actions/cache@v4
        with:
          path: |
            ~/PawPawBuilds
          key: win64-v${{ env.CACHE_VERSION }}

      - name: Bootstrap Win64
        shell: bash
        run: |
          set -e

          apt-get update -qq
          apt-get install -yqq git unzip zip

          git clone https://github.com/DISTRHO/PawPaw.git
          git -C PawPaw checkout ${{ env.PAWPAW_VERSION }}

          ./PawPaw/.github/workflows/bootstrap-deps.sh win64
          ./PawPaw/bootstrap-carla.sh win64
          ./PawPaw/.cleanup.sh win64

      - name: Build Win64
        shell: bash
        run: |
          set -e

          source PawPaw/local.env win64

          echo "========================================"
          echo "MANDATORY FLUIDSYNTH VERIFICATION"
          echo "========================================"

          echo "PAWPAW_PREFIX=$PAWPAW_PREFIX"
          echo "PKG_CONFIG=$PKG_CONFIG"

          echo "--- FluidSynth version ---"
          $PKG_CONFIG --modversion fluidsynth

          echo "--- FluidSynth existence ---"
          $PKG_CONFIG --exists fluidsynth

          echo "--- FluidSynth static libraries ---"
          FLUIDSYNTH_LIBS="$($PKG_CONFIG --static --libs fluidsynth)"
          echo "$FLUIDSYNTH_LIBS"

          echo "$FLUIDSYNTH_LIBS" | grep -qi fluidsynth

          echo "--- FluidSynth CFLAGS ---"
          $PKG_CONFIG --static --cflags fluidsynth

          echo "========================================"
          echo "FLUIDSYNTH DETECTED - FORCING CARLA"
          echo "========================================"

          make features HAVE_FLUIDSYNTH=true

          echo "========================================"
          echo "BUILDING CARLA WITH FLUIDSYNTH"
          echo "========================================"

          make NOOPT=true HAVE_FLUIDSYNTH=true ${MAKE_ARGS}
          make NOOPT=true HAVE_FLUIDSYNTH=true ${MAKE_ARGS} win32r

          echo "========================================"
          echo "PACKAGING CARLA"
          echo "========================================"

          make dist HAVE_FLUIDSYNTH=true ${MAKE_ARGS} -j 1

          echo "========================================"
          echo "FINAL ZIP"
          echo "========================================"

          ls -lh ./*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Carla Win64
          path: ./*.zip
